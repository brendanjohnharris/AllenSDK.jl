[deps]
pandas = "==1.5.3"
scipy = "<1.11"
numpy = "<1.24"
xarray = "<2023.2.0"
urllib3 = "<2" # Prevents appengine removal error
setuptools = "<81" # Removes warning about pkg_resources deprecation
python = ">=3.9,<3.13"

[pip.deps]
pynwb = "<3"
hdmf = ">3.8,<4"
h5py = "!=3.12.0" # pip wheel ships its own privately named HDF5, so it never shares HDF5_jll's libhdf5; 3.12.0 fails to import on Windows
allensdk = "==2.16.2"
statsmodels = "<0.15" # 0.15.0 removed sandbox.stats.multicomp.multipletests, which allensdk 2.16.2 imports
argschema = ">=3.0.1"
